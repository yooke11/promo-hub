# 자동 생성: scripts/build_beauty_candidates2.py — 뷰티 2차 후보(올리브영 상위 + VT)
defaults:
  scroll_steps: 8
  detail_limit: 30
  product_limit: 40
  delay_sec: 2.0
  respect_robots: true
common_include_patterns:
- (event|events|exhibit|exhibition|exhibitions|plan|planshop|promotion|promotions|campaign|campaigns|special|festa|fair)s?[/?=.]
- 기획전|이벤트
common_exclude_patterns:
- login|logout|member|cart|order|mypage|customer|cs/|notice|faq|policy|terms|app-download|join|signup
- \.(jpg|jpeg|png|gif|webp|svg|css|js)(\?|$)
sources:
- id: medicube
  name: 메디큐브
  channel_type: brand
  rank: 340
  vertical: beauty
  domains:
  - themedicube.co.kr
  mobile: false
  entry_urls:
  - https://themedicube.co.kr/product/list.html?cate_no=1230
  - https://themedicube.co.kr/board/event/list.html?board_no=8
  include_patterns:
  - project\.html
  - /board/(event|gallery)[^/]*/
  - /article/[^/]+/\d+/\d+
  - /exhibit
  - /promotion
  - goods_list\.php\?cateCd=
  - board/(list|view)\.php\?.*bdId=(promotion|event)
  - htmid=[^&]*event
  - cate_no=1230\b
  - /event/[\w-]+\.html
  exclude_patterns:
  - /product/detail\.html
  - product_no=
  - /product/[^?]+/\d+/category/
  - goods_view\.php
  - period=end
  - write\.html
  - event_result
