# 자동 생성: scripts/build_beauty_candidates2.py — 뷰티 2차 후보(올리브영 상위 + VT)
defaults:
  scroll_steps: 8
  detail_limit: 30
  product_limit: 40
  delay_sec: 2.0
  respect_robots: true
common_include_patterns:
- (event|events|exhibit|exhibition|exhibitions|plan|planshop|promotion|promotions|campaign|campaigns|special|festa|fair)s?[/?=.]
- 기획전|이벤트
common_exclude_patterns:
- login|logout|member|cart|order|mypage|customer|cs/|notice|faq|policy|terms|app-download|join|signup
- \.(jpg|jpeg|png|gif|webp|svg|css|js)(\?|$)
sources:
- id: vtcosmetics
  name: VT코스메틱
  channel_type: brand
  rank: 340
  vertical: beauty
  domains:
  - vtcosmetics.com
  - vt-cosmetics.co.kr
  mobile: false
  entry_urls:
  - https://www.vtcosmetics.com/
  - https://www.vtcosmetics.com/board/event/list.html
  - https://www.vtcosmetics.com/product/project.html
  include_patterns:
  - project\.html
  - /board/(event|gallery)[^/]*/
  - /article/[^/]+/\d+/\d+
  - /exhibit
  - /promotion
  - /product/list\.html\?cate_no=
  - goods_list\.php\?cateCd=
  - board/(list|view)\.php\?.*bdId=(promotion|event)
  - htmid=[^&]*event
  exclude_patterns: &id001
  - /product/detail\.html
  - product_no=
  - /product/[^?]+/\d+/category/
  - goods_view\.php
