# 수집 대상: 국내 쇼핑몰 트래픽 상위 50 (추정 순위)
# 순위 근거(2026-11 작성): Similarweb 이커머스 KR 상위 5(2026-10, 웹 방문) · Semrush KR 리테일 상위 20(2026-10, 웹 방문)
#                         · 와이즈앱 종합몰/버티컬 앱 사용자 순위(2026-02~08) 공개치를 교차해 추정. 유료 순위표가 생기면 rank 값만 교체.
# 제외: 쇼핑몰이 아닌 사이트(게임·커뮤니티), 서비스 종료(위메프·티몬), 중고거래·배달앱.
#
# 필드
#  rank            트래픽 추정 순위(화면 정렬·수집 순서에 사용)
#  domains         이 도메인(하위 포함) 링크만 기획전으로 인정
#  entry_urls      수집 시작 페이지(메인·이벤트 목록). 여러 개 가능
#  include_patterns 기획전/이벤트 URL 정규식(공통 패턴과 합쳐짐)
#  product_patterns 상품 상세 URL 정규식 → 기획전 안의 판매 상품 추출에 사용(공통 패턴과 합쳐짐)
#  mobile          true면 모바일 UA로 접속
# ※ URL·패턴은 사이트 개편 시 바뀝니다. 운영 전 `python -m promohub.cli probe <id>` 로 채널별 1회 점검하세요.

defaults:
  scroll_steps: 8
  detail_limit: 30
  product_limit: 40
  delay_sec: 2.0
  respect_robots: true
common_include_patterns:
- (event|events|exhibit|exhibition|exhibitions|plan|planshop|promotion|promotions|campaign|campaigns|special|festa|fair)s?[/?=.]
- 기획전|이벤트
common_exclude_patterns:
- login|logout|member|cart|order|mypage|customer|cs/|notice|faq|policy|terms|app-download|join|signup
- \.(jpg|jpeg|png|gif|webp|svg|css|js)(\?|$)
