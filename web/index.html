<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프로모션 허브 — 쇼핑몰 기획전·이벤트·특가상품</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="manifest" id="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" id="appleicon" href="/icon-180.png">
<meta name="theme-color" id="themecolor" content="#2b50d8">
<script src="config.js"></script>
<style>
  /* 2026-11-26 재설계: 소비자용 딜 사이트 — 한 줄 상단(로고·검색) + 목적별 탭 + 접히는 필터, 가격이 주인공 */
  :root{color-scheme:light dark;
    --bg:light-dark(#f4f5f7,#101114); --panel:light-dark(#fff,#191b1f); --ink:light-dark(#1b1d22,#eef0f3);
    --ink-2:light-dark(#4a4f59,#b9bec7); --ink-3:light-dark(#8a8f98,#7c818b); --line:light-dark(#e4e6ea,#2a2d33);
    --chip:light-dark(#eef0f3,#23262c); --deal:light-dark(#e3311f,#ff5a48); --ok:light-dark(#0b7d4b,#3ccf8e);
    --accent:#2b50d8; --soon:#2b50d8; --r:14px}
  :root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
  *{box-sizing:border-box;min-width:0}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Pretendard Variable",Pretendard,"Noto Sans KR",-apple-system,system-ui,sans-serif;
       -webkit-font-smoothing:antialiased;letter-spacing:-.01em;overflow-x:clip}
  a{color:inherit;text-decoration:none}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
  .num{font-variant-numeric:tabular-nums;white-space:nowrap}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

  /* 상단 */
  .top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
  .top-in{max-width:1280px;margin:0 auto;padding:12px 24px 0;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
  .logo{font-weight:800;letter-spacing:-.04em;font-size:21px;white-space:nowrap;display:flex;align-items:baseline;gap:10px}
  .logo i{display:none}
  .logo .tagline{font-size:13px;font-weight:500;color:var(--ink-3);letter-spacing:-.01em}
  .search{flex:1;max-width:520px;margin-left:auto;position:relative}
  .search input{width:100%;padding:11px 16px 11px 42px;border-radius:12px;border:1px solid transparent;background:var(--chip);outline:none;font-size:15px}
  .search input:focus{border-color:var(--ink);background:var(--panel)}
  .search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
  .meta{display:none}
  .vnav{display:none}
  .tabs{flex-basis:100%;display:flex;gap:26px;overflow-x:auto;scrollbar-width:none;margin-top:4px}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{border:0;background:none;padding:12px 0 13px;font-size:16px;font-weight:600;color:var(--ink-3);white-space:nowrap;position:relative;display:flex;gap:6px;align-items:center}
  .tabs button[aria-pressed=true]{color:var(--ink)}
  .tabs button[aria-pressed=true]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--accent)}
  .tabs .cnt{font-size:12px;font-weight:700;color:var(--deal)}
  .demo{background:light-dark(#fff4d6,#3a2f0f);color:light-dark(#6b4e00,#f3dc9b);font-size:13px}
  .demo div{max-width:1280px;margin:0 auto;padding:8px 24px}

  /* 본문 */
  .wrap{max-width:1280px;margin:0 auto;padding:28px 24px 96px}
  .intro{margin-bottom:22px}
  .intro h1{margin:0;font-size:30px;line-height:1.2;font-weight:800;letter-spacing:-.045em}
  .intro p{margin:8px 0 0;color:var(--ink-2);font-size:15px;max-width:62ch}
  .stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .stat{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 13px;font-size:13.5px;color:var(--ink-2);display:inline-flex;gap:6px;align-items:baseline}
  .stat b{color:var(--ink);font-weight:700}
  .stat.hot b{color:var(--deal)}
  button.stat[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}button.stat[aria-pressed=true] b{color:inherit}

  .bar{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .bar .sp{flex:1}
  .count{font-size:14px;color:var(--ink-2)}.count b{color:var(--ink)}.count small{color:var(--ink-3);margin-left:4px;font-size:13px}
  .fbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 13px;font-size:14px;font-weight:600}
  .fbtn .n{background:var(--accent);color:#fff;border-radius:999px;font-size:11.5px;padding:0 7px;line-height:18px}
  .pill{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--chip);border-radius:999px;padding:6px 8px 6px 12px;font-size:13px;font-weight:500}
  .pill span{width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--ink) 12%,transparent);font-size:11px;line-height:1}
  select{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:14px}
  .seg{display:flex;background:var(--chip);padding:3px;border-radius:10px}
  .seg button{flex:1;border:0;background:transparent;padding:5px 10px;border-radius:8px;font-size:13px;white-space:nowrap;color:var(--ink-2)}
  .seg button[aria-pressed=true]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}

  /* 필터 시트 */
  .side{position:fixed;top:0;right:0;bottom:0;width:min(400px,100vw);background:var(--panel);z-index:41;transform:translateX(100%);visibility:hidden;
        transition:transform .22s ease,visibility .22s;display:flex;flex-direction:column}
  body.fopen .side{transform:none;visibility:visible}
  body.fopen .scrim{opacity:1;pointer-events:auto}
  .side-h{display:flex;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
  .side-h b{font-size:18px;font-weight:700}.side-h .sp{flex:1}
  .side-b{flex:1;overflow:auto;padding:18px 20px 24px;display:flex;flex-direction:column;gap:24px}
  .side-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px}
  .side-f button{flex:1;border-radius:12px;padding:13px;font-weight:700;font-size:15px;border:1px solid var(--line);background:var(--panel)}
  .side-f .apply{flex:2;background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .xbtn{border:0;background:var(--chip);width:36px;height:36px;border-radius:50%;font-size:18px;line-height:1}
  .grp h4{margin:0 0 10px;font-size:15px;color:var(--ink);font-weight:700;display:flex;justify-content:space-between}
  .grp h4 span + span{color:var(--ink-3);font-weight:500;font-size:13px}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:999px;font-size:14px;display:inline-flex;gap:6px;align-items:center}
  .chip .n{color:var(--ink-3);font-size:12px}
  .chip .rk{display:none}
  .chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
  .chip[aria-pressed=true] .n{color:inherit;opacity:.65}
  .dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
  .chip .dot{display:none}
  .more{border:0;background:none;color:var(--ink-2);font-size:13px;text-decoration:underline;padding:8px 0 0}
  .range{display:flex;gap:8px;align-items:center}
  .range input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:14px}
  .reset{display:none}

  /* 섹션 */
  .pk-sec{margin:38px 0 14px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  #view > .pk-sec:first-child{margin-top:4px}
  .pk-sec h3{margin:0;font-size:21px;font-weight:800;letter-spacing:-.035em}
  .pk-sec span{color:var(--ink-3);font-size:14px}
  .rowx{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 4*16px)/5);gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:thin}
  .rowx > *{scroll-snap-align:start}

  /* 상품 카드 */
  .pgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:28px 16px}
  .pcard{display:flex;flex-direction:column;gap:10px;color:inherit}
  .pcard .pimg{aspect-ratio:1;border-radius:12px;border:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
  .pcard:hover .nm{text-decoration:underline;text-underline-offset:3px}
  .pcard .pb{display:flex;flex-direction:column;gap:4px;flex:1;padding:0 2px}
  .pcard .mall{font-size:12.5px;color:var(--ink-3);font-weight:600}
  .pcard .br{display:none}
  .pcard .nm{font-size:14.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink)}
  .price{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;margin-top:2px}
  .price em{font-style:normal;color:var(--deal);font-weight:800;font-size:18px;letter-spacing:-.02em}
  .price b{font-size:18px;font-weight:800;white-space:nowrap;letter-spacing:-.03em}
  .price s{color:var(--ink-3);font-size:12.5px;flex-basis:100%;margin-top:-2px}
  .price .na{color:var(--ink-3);font-size:13px}
  .trust{font-size:12.5px;font-weight:600;color:var(--ok);display:flex;gap:4px;align-items:center}
  .trust.warn{color:var(--ink-3);font-weight:500}
  .trust.hot{color:var(--deal)}
  .pcard .from{display:none}
  .chtag{display:none}
  .pk .rank{position:absolute;left:10px;bottom:4px;z-index:2;font-size:46px;font-weight:900;line-height:1;letter-spacing:-.06em;color:#fff;
            -webkit-text-stroke:1px rgba(0,0,0,.25);text-shadow:0 2px 12px rgba(0,0,0,.35);font-variant-numeric:tabular-nums}

  /* 찜 */
  .pcard{position:relative}
  .pcard > a{display:flex;flex-direction:column;gap:10px;color:inherit}
  .pcard:hover .nm{text-decoration:underline;text-underline-offset:3px}
  .heart{position:absolute;top:8px;right:8px;z-index:3;width:36px;height:36px;border-radius:50%;border:0;background:color-mix(in srgb,#fff 88%,transparent);
         display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.12);color:#5b606a}
  .heart svg{width:19px;height:19px}
  .heart[aria-pressed=true]{color:var(--deal)}
  .heart[aria-pressed=true] svg path{fill:currentColor}
  .unit{font-size:12.5px;color:var(--ink-3)}
  .unit b{color:var(--ink-2);font-weight:600}
  .alertbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:24px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .alertbox p{margin:0;flex:1;min-width:220px;font-size:14px;color:var(--ink-2)}
  .alertbox p b{color:var(--ink);display:block;font-size:15px;margin-bottom:2px}
  .alertbox button{border:0;border-radius:10px;padding:10px 16px;font-weight:700;background:var(--ink);color:var(--bg)}
  .alertbox button.off{background:var(--chip);color:var(--ink-2)}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:14px;z-index:60;
         opacity:0;pointer-events:none;transition:opacity .2s}
  .toast.on{opacity:1}

  /* PC: 따라다니는 찜 목록(오른쪽). 넓은 화면은 목록, 좁은 PC 화면은 작은 버튼, 모바일은 숨김(상단 '찜' 탭) */
  .favrail{position:fixed;right:20px;top:50%;transform:translateY(-50%);z-index:30;width:104px;background:var(--panel);border:1px solid var(--line);
           border-radius:16px;box-shadow:0 8px 28px -12px rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:stretch;overflow:hidden}
  .favrail .fr-h{border:0;background:none;padding:12px 8px 10px;font-size:13.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;border-bottom:1px solid var(--line)}
  .favrail .fr-h svg{width:20px;height:20px;color:var(--deal)}
  .favrail .fr-h svg path{fill:currentColor}
  .favrail .fr-h b{color:var(--deal)}
  .favrail .fr-list{display:flex;flex-direction:column;gap:10px;padding:10px 10px 4px;max-height:52vh;overflow:auto;scrollbar-width:none}
  .favrail .fr-list::-webkit-scrollbar{display:none}
  .favrail .fr-it{display:flex;flex-direction:column;gap:3px;position:relative}
  .favrail .fr-it .pimg{aspect-ratio:1;border-radius:10px;border:1px solid var(--line)}
  .favrail .fr-it .pr{font-size:12px;font-weight:700;text-align:center}
  .favrail .fr-it .x{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:12px;line-height:20px;padding:0;display:none}
  .favrail .fr-it:hover .x,.favrail .fr-it:focus-within .x{display:block}
  .favrail .fr-empty{font-size:12px;color:var(--ink-3);text-align:center;padding:12px 8px;line-height:1.45;word-break:keep-all}
  .favrail .fr-more{border:0;background:none;font-size:12.5px;font-weight:600;color:var(--ink-2);padding:9px 6px;border-top:1px solid var(--line)}
  .favrail .fr-top{border:0;background:var(--chip);font-size:12px;color:var(--ink-2);padding:8px 6px}
  @media (max-width:1439px){ .favrail{width:auto;top:auto;bottom:24px;transform:none;border-radius:999px}
    .favrail .fr-list,.favrail .fr-more,.favrail .fr-top,.favrail .fr-empty{display:none}
    .favrail .fr-h{flex-direction:row;padding:11px 16px;border:0;gap:6px} }
  @media (max-width:760px){ .favrail{display:none} }

  /* 이미지 */
  .pimg{position:relative;overflow:hidden;background:var(--chip);display:block}
  .pimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .pimg .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;
            font-size:12px;font-weight:600;line-height:1.3;color:var(--ink-3);word-break:keep-all}

  /* 기획전 카드 */
  .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0}
  .card:hover{border-color:var(--ink-3)}
  .thumbs{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:2px;aspect-ratio:3/2;background:var(--line)}
  .thumbs .pimg:first-child{grid-row:1 / span 2}
  .thumbs.one{grid-template-columns:1fr;grid-template-rows:1fr}
  .thumbs.none{display:flex;align-items:center;justify-content:center;background:var(--chip);font-size:22px;font-weight:800;letter-spacing:-.04em;color:var(--ink-2);padding:16px;text-align:center}
  .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
  .card .r1{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3);font-weight:600}
  .card .r1 .sp{flex:1}
  .ttl{font-weight:700;font-size:16px;line-height:1.35;letter-spacing:-.025em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .r3{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin-top:auto;padding-top:4px}
  .card .r3 .disc{color:var(--deal);font-weight:800;font-size:16px}
  .dday{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--chip);color:var(--ink-2);white-space:nowrap}
  .dday.hot{background:color-mix(in srgb,var(--deal) 12%,transparent);color:var(--deal)}
  .dday.up{background:color-mix(in srgb,var(--soon) 12%,transparent);color:var(--soon)}
  .tag{font-size:11.5px;font-weight:700;color:var(--accent)}
  .ben{font-size:12px;padding:2px 7px;border-radius:6px;background:var(--chip);color:var(--ink-2)}
  .tlist{display:flex;flex-direction:column;gap:4px;font-size:13px;margin-top:2px}
  .tlist div{display:flex;gap:8px;align-items:baseline}
  .tlist .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
  .tlist em{font-style:normal;color:var(--deal);font-weight:700;font-size:12.5px}
  .tlist b{font-weight:700}

  /* 표(텍스트 보기) */
  table.pt{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;font-size:14px}
  .pt th{font-size:12.5px;color:var(--ink-3);font-weight:600;text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  .pt td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  .pt td.r,.pt th.r{text-align:right}
  .pt td.d{color:var(--deal);font-weight:700}
  .pt tr:hover td{background:color-mix(in srgb,var(--chip) 60%,transparent)}
  .pt .sub{color:var(--ink-3);font-size:12.5px}
  .neg{color:var(--ok);font-weight:650}.pos{color:var(--deal);font-weight:650}
  .chip-ch{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
  .chip-ch .dot{display:none}

  /* 상세 패널 */
  .scrim{position:fixed;inset:0;background:rgba(10,12,16,.42);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100vw);background:var(--bg);z-index:41;transform:translateX(100%);visibility:hidden;
          transition:transform .25s ease,visibility .25s;display:flex;flex-direction:column}
  body.dopen .scrim{opacity:1;pointer-events:auto}body.dopen .drawer{transform:none;visibility:visible}
  .dh{padding:22px 24px 18px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;position:relative}
  .dh .x{position:absolute;top:16px;right:16px;border:0;background:var(--chip);width:38px;height:38px;border-radius:50%;font-size:18px}
  .dh h2{margin:0;font-size:23px;letter-spacing:-.035em;line-height:1.3;padding-right:44px;font-weight:800}
  .dh .chbig{font-size:14px;font-weight:700;color:var(--ink-3)}
  .dh .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--ink-2)}
  .go{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 18px;font-weight:700;font-size:15px;align-self:flex-start;border:0;margin-top:4px}
  .db{padding:20px 24px 48px;overflow:auto;flex:1}
  .db .pgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  details.kwbox{margin-top:28px;border-top:1px solid var(--line);padding-top:14px}
  details.kwbox summary{cursor:pointer;color:var(--ink-3);font-size:13.5px;font-weight:600}
  .kw{padding:12px 0 0}
  .kw-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .kw-h b{font-size:15px}.kw-h .sp{flex:1}
  .kw-h button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:600}
  .kw ol{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px}
  .kw li{display:flex;align-items:baseline;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line)}
  .kw li .r{color:var(--ink-3);font-size:11.5px;width:16px;text-align:right;flex:none}
  .kw li .k{font-weight:650;font-size:14px}
  .kw li .t{font-size:10.5px;padding:1px 6px;border-radius:5px;background:var(--chip);color:var(--ink-2);white-space:nowrap}

<script>
{
const CT = {openmarket:"오픈마켓·종합몰", crossborder:"해외직구", department:"백화점·대형마트", homeshopping:"홈쇼핑", fashion:"패션", vertical:"뷰티·리빙·식품", brand:"가전·브랜드몰"};
const PALETTE = ["#ff4d2e","#1f6feb","#11845b","#8a3ffc","#d99a00","#d0287a","#0e8f9c","#5b6b00","#b5521b","#3f51b5","#c2185b","#2e7d32","#6a4c93","#00796b"];
const BENEFITS = ["할인","쿠폰","적립","카드혜택","경품·추첨","사은품","1+1","무료배송"];
const SORTS = {cards:[["ending","마감 빠른 순"],["new","새로 뜬 순"],["discount","할인율 높은 순"],["rank","인기 쇼핑몰 순"]],
               products:[["discount","할인율 높은 순"],["unit","100g·100ml당 싼 순"],["vs_market","웹 최저가보다 싼 순"],["price","낮은 가격 순"],["price_desc","높은 가격 순"],["ending","마감 빠른 순"]]};
const DAY = 864e5, today = new Date(); today.setHours(0,0,0,0);
/* 분야별 페이지: /food /fashion /beauty, 전용 주소 장보기픽·패션세일픽·뷰티세일픽 (채널 묶음은 DB source_verticals) */
const VERTS = {
  "": {label:"전체", title:"오늘의 추천 상품", doc:"프로모션 허브"},
  food: {ph:"상품·브랜드 검색 (예: 만두, 한우, 귤, 햇반)", brand:"장보기픽", color:"#12a150", label:"식품·장보기", title:"오늘의 장보기 특가", doc:"장보기픽 — 마트·식품몰 특가 한눈에",
         tagline:"마트·식품몰 특가를 매일 아침 한곳에",
         desc:"마트·식품 브랜드몰·신선식품몰 기획전에서 오늘 장보기 좋은 상품만 골랐어요."},
  fashion: {ph:"상품·브랜드 검색 (예: 패딩, 니트, 나이키)", brand:"패션세일픽", color:"#6d28d9", label:"패션", title:"오늘의 패션 세일", doc:"패션세일픽 — 브랜드 공식몰 세일 한눈에",
         tagline:"브랜드 공식몰 세일을 매일 아침 한곳에",
         desc:"브랜드 공식몰·편집숍 기획전에서 지금 사기 좋은 옷과 신발을 골랐어요."},
  beauty: {ph:"상품·브랜드 검색 (예: 크림, 선크림, 쿠션)", brand:"뷰티세일픽", color:"#e11d74", label:"뷰티", title:"오늘의 뷰티 특가", doc:"뷰티세일픽 — 화장품 공식몰 특가 한눈에",
         tagline:"화장품 브랜드 공식몰 특가를 매일 아침 한곳에",
         desc:"화장품 브랜드 공식몰 기획전에서 할인 폭이 크고 많이 찾는 제품을 골랐어요."}
};
const HOSTS = {jangbopick:"food", fashionsalepick:"fashion", beautysalepick:"beauty"};
const VKEY = (() => {
  const h = Object.keys(HOSTS).find(k => location.hostname.startsWith(k)); if(h) return HOSTS[h];
  const m = location.pathname.match(/^\/(food|fashion|beauty)\/?$/); return m ? m[1] : (new URLSearchParams(location.search).get("v") || "");
})();
const VCUR = VERTS[VKEY] ? VKEY : "";
const $ = id => document.getElementById(id);

let DATA = [], SOURCES = [], DEMO = false, TRUST = {low:new Set(), bad:new Set()};
// 대조에서 틀린 것으로 나온 채널·상품은 가격 숫자를 숨긴다(단위 가격·최저가 표시도)
const hideUntrusted = r => { if(TRUST.low.has(r.source_id) || TRUST.bad.has(r.url)){ return {...r, price:null, original_price:null, discount_rate:null, market_lowest:null,
  unit_price:null, low_days:null, priceHidden:true}; } return r; };
// 장보기픽은 먹는 것만(식품·건강식품). VCUR 은 아래에서 정해지므로 함수로 판단
const isFoodOnly = () => typeof VCUR !== "undefined" && VCUR === "food";
const st = {q:"", ctypes:new Set(), sources:new Set(), cats:new Set(), kind:"", status:"", bens:new Set(), sort:"ending", view:"picks",
            pmode:"img", lmode:"cards", minP:"", maxP:"", allSrc:false, open:null};
try{ const s = JSON.parse(localStorage.getItem("ph_prefs")||"{}"); if(s.pmode) st.pmode = s.pmode; }catch(e){}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const d = s => s ? new Date(s + "T00:00:00") : null;
const fmt = dt => dt ? `${dt.getMonth()+1}.${String(dt.getDate()).padStart(2,"0")}` : "";
const won = n => n == null ? "" : Number(n).toLocaleString("ko-KR") + "원";
const srcIdx = new Map(); const srcColor = id => PALETTE[(srcIdx.get(id) ?? 0) % PALETTE.length];
const srcRank = id => (SOURCES.find(s => s.id===id)||{}).rank ?? 999;

const CFG = window.PROMOHUB_CONFIG || null;
let MODE = "demo";   // supabase | api | demo
async function sb(path, range){
  const h = {apikey: CFG.anonKey};
  if(!CFG.anonKey.startsWith("sb_")) h.Authorization = "Bearer " + CFG.anonKey;
  if(range) h.Range = range;
  const r = await fetch(`${CFG.supabaseUrl}/rest/v1/${path}`, {headers:h});
  if(!r.ok) throw new Error(`${r.status} ${await r.text()}`);
  return r.json();
}
async function sbAll(path, max=5000){
  let out = [];
  for(let from=0; from<max; from+=1000){
    const part = await sb(path, `${from}-${from+999}`); out = out.concat(part);
    if(part.length < 1000) break;
  }
  return out;
}
async function load(){
  try{
    if(CFG && CFG.supabaseUrl){
      MODE = "supabase";
      const get = () => Promise.all([
        // 장보기픽: 사람이 먹는 상품(식품·건강식품)만 담은 전용 뷰 — 프라이팬·가전 등은 빠진다(2026-11-26)
        sbAll(`${isFoodOnly() ? "v_promotions_food" : "v_promotions"}?select=*&status=neq.ended&order=end_date.asc.nullslast`),
        sb("v_sources?select=*&order=rank.asc")]);
      let p, s;
      try { [p, s] = await get(); } catch(e1) { await new Promise(r => setTimeout(r, 1500)); [p, s] = await get(); }  // 일시 오류면 한 번 더
      if(VCUR){
        const sv = new Set((await sb(`source_verticals?select=source_id&vertical=eq.${VCUR}`)).map(r => r.source_id));
        p = p.filter(x => sv.has(x.source_id)); s = s.filter(x => sv.has(x.id));
      }
      DATA = p; SOURCES = s;
      await applyPriceTrust();
    }else{
      const [p, s] = await Promise.all([fetch("/api/promotions?limit=3000&items_per=60"), fetch("/api/sources")]);
      if(!p.ok || !s.ok) throw 0;
      DATA = (await p.json()).items; SOURCES = await s.json(); MODE = "api";
      if(!DATA.length) throw 0;
    }
    const last = SOURCES.map(s => s.last_crawled).filter(Boolean).sort().pop();
    $("meta").textContent = last ? `마지막 수집 ${new Date(last).toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})}` : "수집 대기 중";
  }catch(e){
    console.warn("데이터 로드 실패 → 샘플", e);
    useDemo(MODE === "supabase" ? String(e && e.message || e).slice(0, 160) : ""); return;
  }
  boot();
}
// 가격 정확도: 상품 페이지 대조에서 틀린 것으로 나온 상품과, 표본의 20% 이상이 틀린 채널은 숫자를 보여 주지 않는다(2026-11-26).
// 틀린 숫자를 보여 주느니 "판매처에서 확인"으로 둔다. 조회가 실패하면 그대로 둔다.
async function applyPriceTrust(){
  try{
    const r = await fetch(`${CFG.supabaseUrl}/rest/v1/rpc/price_trust`, {method:"POST",
      headers:Object.assign({apikey:CFG.anonKey, "Content-Type":"application/json"},
        CFG.anonKey.startsWith("sb_") ? {} : {Authorization:"Bearer " + CFG.anonKey}), body:"{}"});
    if(!r.ok) return;
    const t = await r.json(), low = new Set(t.low_sources || []), bad = new Set(t.bad_urls || []);
    TRUST = {low, bad};
    if(!low.size && !bad.size) return;
    DATA.forEach(pr => (pr.items||[]).forEach(p => {
      if(low.has(pr.source_id) || bad.has(p.url)){
        p.price = null; p.original_price = null; p.discount_rate = null; p.market_lowest = null; p.priceHidden = true;
      }
    }));
    DATA.forEach(pr => { if(low.has(pr.source_id)){ pr.max_discount = null; pr.min_price = null; } });
  }catch(e){ console.warn("price_trust", e); }
}
function useDemo(err){
  MODE = "demo"; DEMO = true; ({items:DATA, sources:SOURCES} = demoData());
  if(err) $("demo").firstElementChild.innerHTML = `실제 수집 데이터를 불러오지 못해 <b>샘플 데이터</b>를 보여 주고 있습니다. 잠시 후 새로고침해 주세요. <small style="opacity:.7">(${esc(err)})</small>`;
  $("demo").hidden = false; $("meta").textContent = "샘플 모드"; boot();
}
function boot(){
  $("vnav").innerHTML = "";
  const V = VERTS[VCUR];
  if(V.brand){
    document.documentElement.style.setProperty("--accent", V.color);
    document.querySelector(".logo").innerHTML = `<i style="background:${V.color}"></i>${esc(V.brand)}<small class="tagline">${esc(V.tagline)}</small>`;
    const md = document.querySelector('meta[name="description"]') || document.head.appendChild(Object.assign(document.createElement("meta"), {name:"description"}));
    md.content = V.desc;
    if(V.ph) $("q").placeholder = V.ph;
  }
  document.title = VERTS[VCUR].doc;
  if(VCUR){ $("manifest").href = `/manifest-${VCUR}.webmanifest`; $("appleicon").href = `/icon-${VCUR}-180.png`; }
  $("themecolor").content = (V.color || "#2b50d8");
  const qv = new URLSearchParams(location.search).get("view");
  if(qv && ["picks","ending","cards","products","fav"].includes(qv)) st.view = qv;
  if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(e => console.warn("sw", e));
  SOURCES.sort((a,b) => (a.rank??999)-(b.rank??999)); SOURCES.forEach((s,i) => srcIdx.set(s.id, i));
  DATA.forEach(i => { i.items = i.items || []; i.benefits = i.benefits || []; });
  setSorts(); renderSide(); render();
}

/* 상품 보기(Supabase): 서버에서 필터·정렬해 가져옴 */
let PCACHE = {key:"", list:null}, ptimer = null;
function serverProducts(){
  const q = st.q.trim().toLowerCase();
  const f = ["select=*"];
  if(q) f.push(`search_text=ilike.*${encodeURIComponent(q.replace(/[*,()]/g," "))}*`);
  if(st.minP !== "") f.push(`price=gte.${+st.minP}`);
  if(st.maxP !== "") f.push(`price=lte.${+st.maxP}`);
  // 분야 사이트(장보기픽 등)는 그 분야 쇼핑몰 상품만 — 예전엔 빠져 있어 KT알파쇼핑 등 다른 몰 상품이 섞였다(2026-11-26)
  const srcIds = st.sources.size ? [...st.sources] : (VCUR ? SOURCES.map(s => s.id) : []);
  if(srcIds.length) f.push(`source_id=in.(${srcIds.map(encodeURIComponent).join(",")})`);
  if(st.ctypes.size) f.push(`channel_type=in.(${[...st.ctypes].join(",")})`);
  if(isFoodOnly()) f.push(`category=eq.${encodeURIComponent("식품")}`, "category_by_name=is.true", "price=not.is.null", `name=not.in.(${["장바구니 담기","재입고 신청","재입고 알림"].map(encodeURIComponent).join(",")})`);
  else if(st.cats.size) f.push(`category=in.(${[...st.cats].map(c => '"'+encodeURIComponent(c)+'"').join(",")})`);
  f.push("order=" + ({discount:"discount_rate.desc.nullslast,price.asc", vs_market:"vs_market_pct.asc.nullslast", price:"price.asc.nullslast", price_desc:"price.desc.nullslast", ending:"end_date.asc.nullslast", unit:"unit_price_100.asc.nullslast,price.asc"}[st.sort] || "discount_rate.desc.nullslast"));
  return "v_products?" + f.join("&");   // 같은 상품이 여러 기획전에 있어도 한 줄(가장 싼 값)
}
function requestProducts(){
  const key = serverProducts();
  if(PCACHE.key === key && PCACHE.list) return PCACHE.list;
  clearTimeout(ptimer);
  $("view").classList.add("loading");
  ptimer = setTimeout(async () => {
    try{
      const rows = await sb(key, "0-399");
      const byId = new Map(DATA.map(i => [i.id, i]));
      PCACHE = {key, list: rows.map(hideUntrusted).map(r => ({...r, promo: byId.get(r.promotion_id) || {id:r.promotion_id, title:r.promotion_title, url:r.promotion_url, source_id:r.source_id, source_name:r.source_name, end_date:r.end_date}}))};
    }catch(e){ PCACHE = {key, list: []}; console.warn(e); }
    $("view").classList.remove("loading"); render();
  }, 250);
  return null;
}

/* ── 필터 ── */
function promoMatch(i, q){
  return (!st.ctypes.size || st.ctypes.has(i.channel_type)) && (!st.sources.size || st.sources.has(i.source_id)) &&
    (!st.cats.size || st.cats.has(i.category)) && (!st.kind || i.kind === st.kind) &&
    (!st.status || i.status === st.status || (st.status==="new" && i.is_new)) &&
    (!st.bens.size || [...st.bens].every(b => i.benefits.includes(b))) &&
    (!q || (i.title+" "+(i.description||"")+" "+i.source_name).toLowerCase().includes(q) || i.items.some(p => itemText(p).includes(q)));
}
const itemText = p => (p.name+" "+(p.brand||"")).toLowerCase();
const inPrice = p => (st.minP==="" || (p.price!=null && p.price >= +st.minP)) && (st.maxP==="" || (p.price!=null && p.price <= +st.maxP));

function promos(){
  const q = st.q.trim().toLowerCase();
  const r = DATA.filter(i => promoMatch(i, q) && (st.minP==="" && st.maxP==="" || i.items.some(inPrice)));
  const key = {ending:i => i.end_date||"9999", new:i => i.first_seen, discount:i => -(i.max_discount||0), rank:i => srcRank(i.source_id)}[st.sort] || (i => i.end_date||"9999");
  r.sort((a,b) => { const x=key(a), y=key(b); return (x>y)-(x<y); });
  if(st.sort === "new") r.reverse();
  return r;
}
function products(){
  if(MODE === "supabase") return requestProducts();
  const q = st.q.trim().toLowerCase();
  const out = [];
  DATA.filter(i => promoMatch(i, "")).forEach(pr => pr.items.forEach(p => {
    if(!inPrice(p)) return;
    if(q && !itemText(p).includes(q) && !(pr.title.toLowerCase().includes(q))) return;
    out.push({...p, promo:pr});
  }));
  const key = {discount:p => -(p.discount_rate||0), vs_market:p => vsPct(p) ?? 1e9, price:p => p.price ?? 1e12, price_desc:p => -(p.price ?? -1), ending:p => p.promo.end_date||"9999"}[st.sort] || (p => -(p.discount_rate||0));
  return out.sort((a,b) => { const x=key(a), y=key(b); return (x>y)-(x<y); });
}

const vsPct = p => (p.market_lowest > 0 && p.price != null) ? Math.round((p.price - p.market_lowest) * 1000 / p.market_lowest) / 10 : null;
function vsBadge(p){
  const v = vsPct(p); if(v == null) return "";
  if(v <= 0) return `<span class="badge low">웹 최저가${v < 0 ? ` ${v}%` : ""}</span>`;
  return `<span class="badge high">웹보다 +${v}%</span>`;
}
function vsLine(p){
  const parts = [];
  if(p.market_lowest > 0) parts.push(`${vsBadge(p)}<span>웹 최저 <span class="num">${won(p.market_lowest)}</span>${p.market_mall ? ` · ${esc(p.market_mall)}` : ""}</span>`);
  if(p.cross_lowest && p.cross_lowest < p.price) parts.push(`<span class="badge x">다른 기획전 ${won(p.cross_lowest)}</span>`);
  return parts.length ? `<span class="vsm">${parts.join("")}</span>` : "";
}
const ctLabel = t => CT[t] || "";

  const im = p.image_url ? `<img loading="lazy" referrerpolicy="no-referrer" src="${esc(p.image_url)}" alt="" onerror="this.remove()">` : "";
  return `<span class="pimg ${cls}">${ph}${im}</span>`;
}
const priceHtml = p => p.price == null ? `<span class="price"><span class="na">${p.priceHidden ? "가격은 판매처에서 확인" : "가격 정보 없음"}</span></span>` :
  `<span class="price">${p.discount_rate ? `<em class="num">${p.discount_rate}%</em>` : ""}<b class="num">${won(p.price)}</b>${p.discount_rate && p.original_price ? `<s class="num">${won(p.original_price)}</s>` : ""}</span>`;
/* 믿을 만한 한 줄: 웹 최저가보다 싸면 초록, 다른 기획전이 더 싸면 회색 안내 */

function trustLine(p){
  if(p.low_days >= 14 && p.price != null && p.prev_min > p.price) return `<span class="trust">최근 ${p.low_days}일 중 최저가</span>`;
  const v = vsPct(p);
  if(v != null && v < 0) return `<span class="trust">웹 최저가보다 <span class="num">${won(p.market_lowest - p.price)}</span> 저렴</span>`;
  if(v === 0) return `<span class="trust">웹 최저가와 같은 가격</span>`;
  if(p.cross_lowest && p.price && p.cross_lowest < p.price) return `<span class="trust warn">다른 기획전 <span class="num">${won(p.cross_lowest)}</span></span>`;

const ALERT = {supported: "serviceWorker" in navigator && "PushManager" in window && "Notification" in window, on:false, busy:false};
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent), standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
async function alertState(){
  if(!ALERT.supported) return;
  try{ const reg = await navigator.serviceWorker.ready; const sub = await reg.pushManager.getSubscription(); ALERT.on = !!sub && Notification.permission === "granted"; }catch(e){}
  if(st.view === "fav") render();
}
function alertBox(){
  if(isIOS && !standalone && !ALERT.supported) return `<div class="alertbox"><p><b>아이폰에서 알림 받기</b>Safari 아래쪽 공유 버튼 → '홈 화면에 추가'로 앱처럼 연 다음, 찜 탭에서 알림을 켤 수 있어요.</p></div>`;
  if(!ALERT.supported) return "";
  if(ALERT.on) return `<div class="alertbox"><p><b>가격·마감 알림이 켜져 있어요</b>매일 아침, 찜한 상품 가격이 내렸거나 기획전이 내일 끝나면 알려 드려요.</p><button class="off" id="alertoff">알림 끄기</button></div>`;
  if(Notification.permission === "denied") return `<div class="alertbox"><p><b>알림이 막혀 있어요</b>브라우저 주소창 왼쪽의 사이트 설정에서 알림을 '허용'으로 바꾼 뒤 다시 눌러 주세요.</p></div>`;
  return `<div class="alertbox"><p><b>찜한 상품 알림 받기</b>가격이 내리거나 기획전이 끝나기 전날, 매일 아침 한 번 알려 드려요. 로그인은 필요 없어요.</p><button id="alerton">알림 켜기</button></div>`;
}
const b64u = s => { const p = "=".repeat((4 - s.length % 4) % 4), b = atob((s + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(b, c => c.charCodeAt(0)); };
async function rpc(name, body){
  const r = await fetch(`${CFG.supabaseUrl}/rest/v1/rpc/${name}`, {method:"POST", headers:Object.assign({apikey:CFG.anonKey, "Content-Type":"application/json"},
    CFG.anonKey.startsWith("sb_") ? {} : {Authorization:"Bearer " + CFG.anonKey}), body: JSON.stringify(body)});
  if(!r.ok) throw new Error(`${r.status} ${await r.text()}`);
  return r.json();
}
async function alertOn(){
  if(ALERT.busy) return; ALERT.busy = true;
  try{
    const perm = await Notification.requestPermission();
    if(perm !== "granted"){ toast("알림을 허용해야 받을 수 있어요"); return; }
    const key = await rpc("vapid_public", {});
    if(!key){ toast("알림 준비 중이에요. 잠시 뒤 다시 눌러 주세요"); return; }
    const reg = await navigator.serviceWorker.ready;
    const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64u(key)});
    await pushSave(sub); ALERT.on = true; toast("알림을 켰어요");
  }catch(e){ console.warn(e); toast("알림을 켜지 못했어요. 잠시 뒤 다시 시도해 주세요"); }
  finally{ ALERT.busy = false; render(); }
}
async function alertOff(){
  try{ const reg = await navigator.serviceWorker.ready; const sub = await reg.pushManager.getSubscription();
    if(sub){ await rpc("push_delete", {p_endpoint: sub.endpoint}).catch(() => {}); await sub.unsubscribe(); } }catch(e){ console.warn(e); }
  ALERT.on = false; toast("알림을 껐어요"); render();
}
async function pushSave(sub){
  const j = sub.toJSON();
  await rpc("push_save", {p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth, p_vertical: VCUR || "",
    p_items: FAVS.map(f => ({item_key:f.item_key, name:f.name, url:f.url, image_url:f.image_url, source_name:f.source_name}))});
}

function timeline(list){
  const from = new Date(today - 7*DAY), days = 42, to = new Date(+from + days*DAY);
  const pct = dt => Math.max(0, Math.min(100, (dt - from) / (to - from) * 100));
  const dated = list.filter(i => i.end_date || i.start_date), undated = list.length - dated.length;
  const groups = new Map(); dated.forEach(i => { if(!groups.has(i.source_id)) groups.set(i.source_id, []); groups.get(i.source_id).push(i); });
  let head = ""; for(let k=0;k<days;k++){ const dt = new Date(+from + k*DAY); if(dt.getDay()===1 || k===0) head += `<div class="tl-day" style="left:${pct(dt)}%">${fmt(dt)}</div>`; }
  const line = cls => `<div class="today ${cls}" style="left:${pct(today)}%"></div>`;
  const rows = SOURCES.filter(s => groups.has(s.id)).map(s => {
    const c = srcColor(s.id), items = groups.get(s.id).sort((a,b) => (a.start_date||"").localeCompare(b.start_date||""));
    return `<div class="tl-row"><div class="tl-name"><span class="dot" style="background:${c};margin-top:5px"></span><span>${esc(s.name)} <small>${items.length}</small></span></div>
      <div class="tl-lane">${line("")}${items.map(i => {
        const sd = d(i.start_date) || new Date(Math.min(+today, +d(i.end_date))), ed = d(i.end_date) || to;
        const L = pct(sd), R = pct(new Date(+ed + DAY));
        return `<div class="tl-bar"><button data-open="${esc(i.id)}" title="${esc(i.title)} (${fmt(sd)}~${i.end_date?fmt(ed):"상시"})"

const KCACHE = new Map();
const KIND = {brand:"브랜드+품목", benefit:"품목+혜택", event:"시즌·행사", intent:"구매의도", longtail:"상품 롱테일", category:"카테고리", related:"연관 검색어"};
async function loadKeywords(i){
  if(KCACHE.has(i.id)) return;
  if(MODE === "supabase"){
    try{ KCACHE.set(i.id, await sb(`promotion_keywords?select=*&promotion_id=eq.${encodeURIComponent(i.id)}&order=rank.asc`)); }
    catch(e){ KCACHE.set(i.id, []); }
  }else KCACHE.set(i.id, demoKeywords(i));
}
function kwHtml(i){
  const ks = KCACHE.get(i.id);
  if(!ks) return `<div class="kw"><div class="kw-h"><b>검색광고 추천 키워드</b></div><div class="note">불러오는 중…</div></div>`;
  if(!ks.length) return `<div class="kw"><div class="kw-h"><b>검색광고 추천 키워드</b></div><div class="note">아직 생성되지 않았습니다. 매일 새벽 수집 뒤 자동으로 만들어집니다.</div></div>`;
  const vol = k => (k.pc == null && k.mobile == null) ? null : (k.pc||0) + (k.mobile||0);
  const hasVol = ks.some(k => vol(k) != null);
  return `<div class="kw"><div class="kw-h"><b>검색광고 추천 키워드</b><span class="sub">${ks.length}개</span><span class="sp"></span>
      <button id="kwcopy" data-id="${esc(i.id)}">키워드 복사</button></div>
    <ol>${ks.map((k,n) => `<li title="${esc(k.reason||"")}"><span class="r">${n+1}</span><span class="k">${esc(k.keyword)}</span><span class="t">${esc(k.kind_label || KIND[k.kind] || k.kind)}</span>
      <span class="v">${vol(k)!=null ? `월 ${vol(k).toLocaleString()}회${k.comp?` · 경쟁 ${esc(k.comp)}`:""}` : ""}</span></li>`).join("")}</ol>
    <div class="note">${hasVol ? "월 검색량은 네이버 검색광고 키워드 도구 기준(PC+모바일)." : "기획전 제목·혜택·담긴 상품(브랜드·품목)으로 만든 후보입니다. 네이버 검색광고 API 키를 등록하면 월 검색량·경쟁도로 다시 정렬됩니다."}
      쇼핑몰·브랜드명이 들어간 키워드는 상표권자(해당 쇼핑몰·브랜드) 광고에만 쓰세요.</div></div>`;
}
function demoKeywords(i){
  const STOP = new Set(["프로","세트","기획세트","포함","리필","대형","구이용","2개입","3종"]);
  const heads = {}; (i.items||[]).forEach(p => { const w = p.name.split(" ").filter(x => /^[가-힣]{2,}$/.test(x) && !STOP.has(x)).pop(); if(w) heads[w] = (heads[w]||0)+1; });
  const top = Object.entries(heads).sort((a,b) => b[1]-a[1]).map(x => x[0]).slice(0,3);
  const out = [];
  const add = (k, kind) => { if(!out.some(o => o.keyword === k)) out.push({keyword:k, kind}); };
  const br = (i.items||[]).find(p => p.brand);
  if(br && top[0]) add(`${br.brand} ${top[0]}`, "brand");
  top.forEach(t => { if(i.max_discount) add(`${t} 할인`, "benefit"); add(`${t} 특가`, "benefit"); });
  const season = (i.title.match(/겨울|연말|블랙프라이데이|크리스마스/)||[])[0];
  if(season && top[0]) add(`${season} ${top[0]}`, "event");
  if(top[0]) { add(`${top[0]} 추천`, "intent"); add(`${top[0]} 최저가`, "intent"); }
  add(`${i.source_name} ${i.title.split(" ")[0]}`, "event");
  return out.slice(0,10).map((k,n) => ({...k, rank:n+1, reason:"샘플"}));
}

const toggle = (set, v) => set.has(v) ? set.delete(v) : set.add(v);
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  const ds = b.dataset;
  if(ds.fav){ e.preventDefault(); toggleFav(ds.fav); return; }
  if(b.id === "totop"){ window.scrollTo({top:0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); return; }
  if(b.id === "alerton"){ alertOn(); return; }
  if(b.id === "alertoff"){ alertOff(); return; }
  if(ds.open){ openDrawer(ds.open); return; }
  if(b.id === "trydemo"){ useDemo(); return; }
  if(b.id === "kwcopy"){
    const ks = KCACHE.get(b.dataset.id) || [];
    const txt = ks.map(k => k.keyword).join("\n");
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => { b.textContent = "복사됨 ✓"; },
      () => { b.textContent = "복사 실패"; });
    setTimeout(() => { b.textContent = "키워드 복사"; }, 1800);
    return;
  }
  if(b.id === "dclose"){ closeDrawer(); return; }
  if(ds.dsort){ dsort = ds.dsort; drawDrawer(); return; }
  if(ds.pmode){ st.pmode = ds.pmode; try{ localStorage.setItem("ph_prefs", JSON.stringify({pmode:st.pmode})); }catch(_){}; drawDrawer(); render(); return; }
  if(ds.view){ st.view = ds.view; if(st.view === "fav") FAVCACHE = null; if(st.view !== "cards") st.status = ""; setSorts(); render(); window.scrollTo({top:0}); return; }
  if(ds.lmode){ st.lmode = ds.lmode; render(); return; }
  if(b.id === "ftoggle"){ renderSide(); document.body.classList.add("fopen"); return; }
  if(b.id === "fclose" || b.id === "fapply"){ document.body.classList.remove("fopen"); return; }
  if(ds.rm != null){ const [k, ...v] = ds.rm.split("|"); removeFilter(k, v.join("|")); renderSide(); render(); return; }
  if(ds.ctype){ toggle(st.ctypes, ds.ctype); st.sources.clear(); }
  else if(ds.src) toggle(st.sources, ds.src);
  else if("kind" in ds) st.kind = ds.kind;
  else if(ds.cat) toggle(st.cats, ds.cat);
  else if(ds.ben) toggle(st.bens, ds.ben);
  else if(ds.pr){ const [a,z] = ds.pr.split("|"); st.minP = a; st.maxP = z; }
  else if(ds.status) st.status = st.status === ds.status ? "" : ds.status;
  else if(b.id === "allsrc") st.allSrc = true;
  else if(b.id === "reset"){ Object.assign(st,{kind:"",status:"",q:"",minP:"",maxP:""}); [st.ctypes,st.sources,st.cats,st.bens].forEach(s => s.clear()); $("q").value=""; }
  else return;
  renderSide(); render();
});

    "식품":["연말 홈파티 먹거리","제철 과일 특가"],"가전·디지털":["겨울 가전 할인전","디지털 연말 결산전"],"생활·주방":["생필품 쟁여두기전","주방용품 브랜드위크"],
    "가구·인테리어":["겨울 침구 특집","리빙 페어"],"스포츠·레저":["겨울 아웃도어 페어","러닝 페어"],"유아동":["육아용품 박람회"],"반려동물":["반려동물 용품전"],"여행·티켓":["연말 여행 특가"],"명품":["명품 브랜드 위크"],"종합":["연말 선물 기획전","오늘의 특가"]};
  const PREF = {openmarket:["시즌·대형행사","가전·디지털","생활·주방","식품","종합"],crossborder:["시즌·대형행사","생활·주방","패션"],department:["식품","생활·주방","명품"],
    homeshopping:["패션","뷰티","가구·인테리어","식품","시즌·대형행사"],fashion:["패션","시즌·대형행사","스포츠·레저"],vertical:["뷰티","식품","가구·인테리어","생활·주방"],brand:["가전·디지털","시즌·대형행사"]};
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const pick = a => a[Math.floor(rnd()*a.length)];
  const iso = n => { const x = new Date(+today + n*DAY); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`; };
  const items = []; let k = 0;
  S.forEach(src => {
    const n = src.rank <= 10 ? 3 : src.rank <= 25 ? 2 : 1 + (rnd() < .4 ? 1 : 0);
    for(let j=0;j<n;j++){
      const cat = j===0 && src.rank<=8 ? "시즌·대형행사" : pick(PREF[src.channel_type]);
      const ev = rnd() < .14, s = -Math.floor(rnd()*10), e = rnd() < .08 ? null : Math.floor(rnd()*18) - (rnd()<.2?0:-1);
      const sd = rnd() < .12 ? Math.floor(rnd()*6)+1 : s, ed = e==null ? null : Math.max(e, sd);
      const prods = ev ? [] : Array.from({length: 4 + Math.floor(rnd()*7)}, () => {
        const [nm, base] = pick(POOL[cat] || POOL["종합"]); const rate = rnd() < .15 ? null : 5 + Math.floor(rnd()*(src.channel_type==="crossborder"?12:9))*5;
        const price = Math.round(base*(0.85 + rnd()*.25)/100)*100 - 100 + 100, orig = rate ? Math.round(price/(1-rate/100)/100)*100 : null;
        const MALLS = ["쿠팡","11번가","G마켓","SSG닷컴","롯데ON","네이버 가격비교","옥션"].filter(m => !m.startsWith(src.name.slice(0,2)));
        const ml = rnd() < .75 ? Math.round(price*(0.9 + rnd()*.25)/100)*100 : null;
        return {name:nm, brand: BR[cat] && src.channel_type!=="crossborder" ? pick(BR[cat]) : "", url:"#", image_url:"", price, original_price: orig, discount_rate: rate,
                market_lowest: ml, market_mall: ml ? pick(MALLS) : ""};
      }).filter((p,i,a) => a.findIndex(q => q.name===p.name) === i);
      const maxd = Math.max(0, ...prods.map(p => p.discount_rate||0)) || null;
      const title = ev ? pick(["출석체크 쿠폰 이벤트","룰렛 돌리고 경품 응모","럭키드로우 추첨 이벤트","댓글 이벤트"]) : pick(T[cat] || T["종합"]);
      const bens = ev ? ["경품·추첨"] : ["할인", ...(rnd()<.5?["쿠폰"]:[]), ...(rnd()<.3?["카드혜택"]:[]), ...(rnd()<.25?["적립"]:[]), ...(rnd()<.2?["무료배송"]:[])];
      const dd = ed==null ? null : ed;
      const status = sd > 0 ? "upcoming" : dd != null && dd <= 3 ? "ending_soon" : "active";
      items.push({id:"demo"+(k++), source_id:src.id, source_name:src.name, channel_type:src.channel_type, url:"#", title, description:"",
        start_date: iso(sd), end_date: ed==null?null:iso(ed), category: ev ? "종합" : cat, kind: ev ? "이벤트" : "기획전", benefits:bens, max_discount:maxd,
        status, d_day: dd, is_new: rnd() < .15, first_seen: new Date(+today - Math.floor(rnd()*7)*DAY).toISOString(),
        items: prods, item_count: prods.length, min_price: prods.length ? Math.min(...prods.map(p => p.price)) : null,
        compared: prods.filter(p => p.market_lowest).length, cheaper_cnt: prods.filter(p => p.market_lowest && p.price <= p.market_lowest).length});
    }
  });
  return {items, sources:S};
}
