<!doctype html><html><head><meta charset="utf-8"><title>테스트몰</title></head><body>
<div id="app">로딩중</div>
<script>
fetch('/api/banners.json').then(r=>r.json()).then(d=>{
  document.getElementById('app').innerHTML = d.list.map(b=>
    `<div class="card"><a href="${b.link}"><img src="${b.img}" alt="${b.alt}"></a></div>`).join('');
});
</script></body></html>
