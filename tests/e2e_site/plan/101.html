<html><head><meta charset="utf-8"><meta property="og:title" content="연말 가전 기획전 | 테스트몰"></head><body>기간 12.01 ~ 12.15
<ul id="list"></ul>
<script>
fetch('/api/plan101.json').then(r=>r.json()).then(d=>{document.getElementById('list').innerHTML=d.items.map(i=>
 `<li><a href="/goods/${i.goodsNo}.html"><img src="${i.img}"><span class="name">${i.goodsNm}</span><b>${i.salePrice.toLocaleString()}원</b></a></li>`).join('')});
</script></body></html>
