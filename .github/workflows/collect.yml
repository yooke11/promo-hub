name: collect

on:
  schedule:
    - cron: "17 */3 * * *"      # 3시간마다(UTC 기준 17분)
  workflow_dispatch:
    inputs:
      only:
        description: "특정 채널만 (쉼표 구분 id, 비우면 전체)"
        required: false
        default: ""

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]       # 50개 채널을 4묶음으로 병렬 수집
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      PROMOHUB_INGEST_TOKEN: ${{ secrets.PROMOHUB_INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: 수집 → Supabase 적재
        run: |
          if [ -n "${{ github.event.inputs.only }}" ]; then
            [ "${{ matrix.shard }}" = "0" ] && python -m promohub.cli collect --sink supabase --only "${{ github.event.inputs.only }}" || true
          else
            python -m promohub.cli collect --sink supabase --shard ${{ matrix.shard }}/4
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - run: python -m pytest -q
