name: collect

on:
  schedule:
    - cron: "0 20 * * *"        # 매일 새벽 5시(한국 시간) = UTC 20:00
  workflow_dispatch:
    inputs:
      only:
        description: "특정 채널만 (쉼표 구분 id, 비우면 전체)"
        required: false
        default: ""

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 28           # 05:30 점검 전에 끝나도록 작업당 28분 제한
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]   # 50개 채널을 8묶음으로 병렬 수집(약 15~25분)
    env:
      # 공개돼도 되는 값(읽기 전용 publishable 키)은 여기 직접 둡니다. 비밀값은 수집 토큰 하나뿐.
      SUPABASE_URL: https://wjfbcbiyzoymqqnoemvu.supabase.co
      SUPABASE_ANON_KEY: sb_publishable_-DNHcg_lvpePh3aeXGRXGw_qDJAkXI5
      PROMOHUB_INGEST_TOKEN: ${{ secrets.PROMOHUB_INGEST_TOKEN }}
    steps:
      - name: 수집 토큰 확인
        run: |
          if [ -z "$PROMOHUB_INGEST_TOKEN" ]; then
            echo "::error::저장소 Settings > Secrets and variables > Actions > Secrets 에 PROMOHUB_INGEST_TOKEN 을 등록하세요."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: 수집 → Supabase 적재
        run: |
          if [ -n "${{ github.event.inputs.only }}" ]; then
            [ "${{ matrix.shard }}" = "0" ] && python -m promohub.cli collect --sink supabase --only "${{ github.event.inputs.only }}" || true
          else
            python -m promohub.cli collect --sink supabase --shard ${{ matrix.shard }}/8
          fi

  enrich:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_URL: https://wjfbcbiyzoymqqnoemvu.supabase.co
      SUPABASE_ANON_KEY: sb_publishable_-DNHcg_lvpePh3aeXGRXGw_qDJAkXI5
      PROMOHUB_INGEST_TOKEN: ${{ secrets.PROMOHUB_INGEST_TOKEN }}
      # 선택: 네이버 검색광고 API(키워드 검색량). 없으면 규칙 기반 키워드만 생성
      NAVER_AD_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
      NAVER_AD_SECRET: ${{ secrets.NAVER_AD_SECRET }}
      NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: 검색광고 추천 키워드 생성
        run: python -m promohub.cli keywords --limit 500
      - run: python -m playwright install --with-deps chromium
      - name: 웹 최저가 비교(에누리 가격비교, 하루 400개 상품)
        run: python -m promohub.cli compare --limit 400

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - run: python -m pytest -q
