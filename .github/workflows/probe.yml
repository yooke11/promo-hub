name: probe

# 진단용: 지정한 기획전 상세 페이지를 수집기와 같은 브라우저 설정으로 열어 HTML·JSON 응답·스크린샷을 아티팩트로 남김(DB 적재 없음).
on:
  workflow_dispatch:
    inputs:
      targets:
        description: "공백 구분 '채널id=URL' 목록"
        required: true

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: 진단
        env:
          TARGETS: ${{ github.event.inputs.targets }}
        run: mkdir -p probe_out && python scripts/probe.py $TARGETS | tee probe_out/summary.txt || true
      - name: 결과를 probe-out 브랜치에 저장(아티팩트 저장소에 접근 못 하는 환경에서도 git 으로 받을 수 있게)
        if: always()
        run: |
          cd probe_out
          git init -q -b probe-out
          git -c user.name=probe -c user.email=probe@users.noreply.github.com add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm "probe ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-out
